<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-loopin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="50%" stop-color="#2d1254"/>
      <stop offset="100%" stop-color="#0f071c"/>
    </linearGradient>
    <linearGradient id="neon-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="250" rx="12" fill="url(#bg-loopin)"/>
  
  <!-- Subtle Tagline -->
  <text x="200" y="38" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#c084fc" text-anchor="middle" letter-spacing="3">INSIGHT TO INTERFACE</text>
  
  <!-- Centered Phone -->
  <g transform="translate(150, 48)">
    <rect x="0" y="0" width="100" height="190" rx="16" fill="#090514" stroke="#4c1d95" stroke-width="2"/>
    <rect x="35" y="6" width="30" height="4" rx="2" fill="#1e1035"/>
    
    <!-- Music App Screen -->
    <!-- Album Cover / Grid -->
    <rect x="12" y="22" width="76" height="65" rx="8" fill="url(#neon-purple)"/>
    <circle cx="50" cy="54" r="18" fill="rgba(0,0,0,0.3)"/>
    <polygon points="46,46 58,54 46,62" fill="#ffffff"/>
    
    <!-- Audio Visualizer Waveform -->
    <g transform="translate(15, 96)" fill="#c084fc">
      <rect x="0" y="8" width="3" height="10" rx="1.5"/>
      <rect x="6" y="4" width="3" height="18" rx="1.5"/>
      <rect x="12" y="10" width="3" height="8" rx="1.5"/>
      <rect x="18" y="2" width="3" height="22" rx="1.5"/>
      <rect x="24" y="6" width="3" height="14" rx="1.5"/>
      <rect x="30" y="1" width="3" height="24" rx="1.5"/>
      <rect x="36" y="8" width="3" height="12" rx="1.5"/>
      <rect x="42" y="3" width="3" height="20" rx="1.5"/>
      <rect x="48" y="9" width="3" height="9" rx="1.5"/>
      <rect x="54" y="5" width="3" height="16" rx="1.5"/>
      <rect x="60" y="2" width="3" height="22" rx="1.5"/>
      <rect x="66" y="7" width="3" height="12" rx="1.5"/>
    </g>
    
    <!-- Track Title -->
    <text x="14" y="132" font-family="sans-serif" font-size="7" font-weight="bold" fill="#ffffff">Midnight Reverie</text>
    <text x="14" y="140" font-family="sans-serif" font-size="5" fill="#a78bfa">Loopin Originals</text>
    
    <!-- Player Controls -->
    <circle cx="50" cy="158" r="10" fill="#a855f7"/>
    <polygon points="48,153 54,158 48,163" fill="#ffffff"/>
    <circle cx="28" cy="158" r="6" fill="#2e1065"/>
    <circle cx="72" cy="158" r="6" fill="#2e1065"/>
  </g>
</svg>
