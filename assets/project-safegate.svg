<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-safegate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#152e1b"/>
      <stop offset="50%" stop-color="#2a4d29"/>
      <stop offset="100%" stop-color="#1a331c"/>
    </linearGradient>
    <linearGradient id="phone-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4e8d4"/>
    </linearGradient>
  </defs>
  
  <!-- Card Background -->
  <rect width="400" height="250" rx="12" fill="url(#bg-safegate)"/>
  
  <!-- Watermark text -->
  <text x="20" y="150" font-family="'Inter', sans-serif" font-weight="900" font-size="52" fill="rgba(255, 255, 255, 0.08)" letter-spacing="2">SAFEGATE</text>
  
  <!-- Mini Header Text -->
  <text x="25" y="40" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#a3e635">The future of secure</text>
  <text x="25" y="55" font-family="'Inter', sans-serif" font-weight="400" font-size="9" fill="rgba(255, 255, 255, 0.7)">Society gatekeeping &amp;</text>
  <text x="25" y="67" font-family="'Inter', sans-serif" font-weight="400" font-size="9" fill="rgba(255, 255, 255, 0.7)">community safety</text>
  
  <!-- Smartphone Frame (Handheld perspective) -->
  <g transform="translate(180, 45)">
    <!-- Phone Shadow -->
    <rect x="5" y="5" width="95" height="185" rx="16" fill="rgba(0, 0, 0, 0.5)" filter="blur(4px)"/>
    <!-- Phone Body -->
    <rect x="0" y="0" width="95" height="185" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- Screen -->
    <rect x="4" y="4" width="87" height="177" rx="12" fill="url(#phone-glow)"/>
    <!-- Notch / Dynamic Island -->
    <rect x="35" y="8" width="25" height="5" rx="2.5" fill="#0f172a"/>
    <!-- App UI inside phone -->
    <rect x="12" y="24" width="30" height="6" rx="2" fill="#166534"/>
    <circle cx="78" cy="27" r="4" fill="#16a34a"/>
    <rect x="12" y="38" width="71" height="40" rx="6" fill="#14532d"/>
    <text x="18" y="55" font-family="sans-serif" font-size="7" font-weight="bold" fill="#ffffff">Welcome Home</text>
    <text x="18" y="65" font-family="sans-serif" font-size="5" fill="#86efac">Gate Access Granted</text>
    
    <!-- Visitor Pass Card -->
    <rect x="12" y="86" width="71" height="28" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="22" cy="100" r="5" fill="#22c55e"/>
    <rect x="32" y="95" width="40" height="4" rx="2" fill="#0f172a"/>
    <rect x="32" y="102" width="25" height="3" rx="1.5" fill="#94a3b8"/>
    
    <!-- Bottom Nav -->
    <rect x="12" y="122" width="71" height="22" rx="4" fill="#f0fdf4"/>
    <circle cx="24" cy="133" r="3" fill="#16a34a"/>
    <circle cx="48" cy="133" r="3" fill="#94a3b8"/>
    <circle cx="70" cy="133" r="3" fill="#94a3b8"/>
  </g>
</svg>
