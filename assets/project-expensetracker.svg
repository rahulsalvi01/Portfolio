<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-expense" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="income-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="expense-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" rx="16" fill="url(#bg-expense)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Window Header / Browser Bar -->
  <rect x="25" y="25" width="750" height="400" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="25" y="25" width="750" height="38" rx="12" fill="#1e293b"/>
  <rect x="25" y="50" width="750" height="13" fill="#1e293b"/>
  
  <!-- Window Control Dots -->
  <circle cx="45" cy="44" r="5" fill="#ef4444"/>
  <circle cx="62" cy="44" r="5" fill="#f59e0b"/>
  <circle cx="79" cy="44" r="5" fill="#10b981"/>

  <!-- Search / URL Bar -->
  <rect x="110" y="34" width="300" height="20" rx="6" fill="#0f172a"/>
  <text x="125" y="48" font-family="'Inter', monospace" font-size="10" fill="#64748b">https://expensetracker.local/dashboard</text>

  <!-- Database Connection Indicator -->
  <g transform="translate(640, 36)">
    <circle cx="6" cy="8" r="4" fill="#10b981"/>
    <text x="16" y="11" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#94a3b8">MySQL Connected</text>
  </g>

  <!-- Sidebar -->
  <rect x="25" y="63" width="130" height="362" fill="#0b1120"/>
  <line x1="155" y1="63" x2="155" y2="425" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Sidebar Nav items -->
  <text x="45" y="96" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#f8fafc" letter-spacing="1">EXPENSE.IO</text>
  <rect x="35" y="115" width="110" height="28" rx="6" fill="#1e293b"/>
  <text x="50" y="133" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#38bdf8">📊 Dashboard</text>
  <text x="50" y="168" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#64748b">💳 Transactions</text>
  <text x="50" y="200" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#64748b">📈 Analytics</text>
  <text x="50" y="232" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#64748b">🗂️ Categories</text>
  <text x="50" y="264" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#64748b">⚙️ Settings</text>

  <!-- Main Dashboard Content Area -->
  <g transform="translate(175, 78)">
    
    <!-- Top Stat Cards (Balance, Income, Expense) -->
    <!-- Card 1: Total Balance -->
    <rect x="0" y="0" width="180" height="74" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="14" y="20" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#94a3b8" letter-spacing="0.5">TOTAL BALANCE</text>
    <text x="14" y="48" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#ffffff">$12,450.00</text>
    <text x="14" y="64" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#10b981">+14.2% vs last month</text>

    <!-- Card 2: Total Income -->
    <rect x="195" y="0" width="180" height="74" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="209" y="20" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#94a3b8" letter-spacing="0.5">TOTAL INCOME</text>
    <text x="209" y="48" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#10b981">+$8,240.50</text>
    <text x="209" y="64" font-family="'Inter', sans-serif" font-size="8" font-weight="500" fill="#64748b">18 Transactions</text>

    <!-- Card 3: Total Expenses -->
    <rect x="390" y="0" width="180" height="74" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="404" y="20" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#94a3b8" letter-spacing="0.5">TOTAL EXPENSES</text>
    <text x="404" y="48" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#ef4444">-$3,190.20</text>
    <text x="404" y="64" font-family="'Inter', sans-serif" font-size="8" font-weight="500" fill="#64748b">34 Transactions</text>

    <!-- Analytics Chart Area -->
    <rect x="0" y="90" width="350" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="16" y="112" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Monthly Cash Flow</text>
    
    <!-- Chart Bars -->
    <g transform="translate(25, 130)">
      <!-- Jan -->
      <rect x="0" y="20" width="14" height="65" rx="3" fill="#3b82f6"/>
      <rect x="16" y="45" width="14" height="40" rx="3" fill="#ef4444"/>
      <text x="12" y="98" font-family="'Inter', sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Jan</text>
      
      <!-- Feb -->
      <rect x="45" y="10" width="14" height="75" rx="3" fill="#3b82f6"/>
      <rect x="61" y="35" width="14" height="50" rx="3" fill="#ef4444"/>
      <text x="57" y="98" font-family="'Inter', sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Feb</text>
      
      <!-- Mar -->
      <rect x="90" y="5" width="14" height="80" rx="3" fill="#3b82f6"/>
      <rect x="106" y="50" width="14" height="35" rx="3" fill="#ef4444"/>
      <text x="102" y="98" font-family="'Inter', sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Mar</text>
      
      <!-- Apr -->
      <rect x="135" y="15" width="14" height="70" rx="3" fill="#3b82f6"/>
      <rect x="151" y="40" width="14" height="45" rx="3" fill="#ef4444"/>
      <text x="147" y="98" font-family="'Inter', sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Apr</text>

      <!-- May -->
      <rect x="180" y="0" width="14" height="85" rx="3" fill="#3b82f6"/>
      <rect x="196" y="55" width="14" height="30" rx="3" fill="#ef4444"/>
      <text x="192" y="98" font-family="'Inter', sans-serif" font-size="8" fill="#64748b" text-anchor="middle">May</text>

      <!-- Jun -->
      <rect x="225" y="8" width="14" height="77" rx="3" fill="#3b82f6"/>
      <rect x="241" y="48" width="14" height="37" rx="3" fill="#ef4444"/>
      <text x="237" y="98" font-family="'Inter', sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Jun</text>
    </g>

    <!-- Recent Transactions Table -->
    <rect x="365" y="90" width="205" height="235" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="380" y="112" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Recent Activity</text>
    
    <!-- Item 1 -->
    <g transform="translate(380, 125)">
      <circle cx="10" cy="10" r="10" fill="rgba(16, 185, 129, 0.15)"/>
      <text x="10" y="14" font-family="'Inter', sans-serif" font-size="9" fill="#10b981" text-anchor="middle">↓</text>
      <text x="28" y="9" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#f1f5f9">Client Payment</text>
      <text x="28" y="18" font-family="'Inter', sans-serif" font-size="7" fill="#64748b">Web Dev Project</text>
      <text x="175" y="14" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#10b981" text-anchor="end">+$2,400</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(380, 160)">
      <circle cx="10" cy="10" r="10" fill="rgba(239, 68, 68, 0.15)"/>
      <text x="10" y="14" font-family="'Inter', sans-serif" font-size="9" fill="#ef4444" text-anchor="middle">↑</text>
      <text x="28" y="9" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#f1f5f9">AWS Cloud Server</text>
      <text x="28" y="18" font-family="'Inter', sans-serif" font-size="7" fill="#64748b">Infrastructure</text>
      <text x="175" y="14" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#ef4444" text-anchor="end">-$84.50</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(380, 195)">
      <circle cx="10" cy="10" r="10" fill="rgba(239, 68, 68, 0.15)"/>
      <text x="10" y="14" font-family="'Inter', sans-serif" font-size="9" fill="#ef4444" text-anchor="middle">↑</text>
      <text x="28" y="9" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#f1f5f9">GitHub Copilot</text>
      <text x="28" y="18" font-family="'Inter', sans-serif" font-size="7" fill="#64748b">Developer Tools</text>
      <text x="175" y="14" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#ef4444" text-anchor="end">-$19.00</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(380, 230)">
      <circle cx="10" cy="10" r="10" fill="rgba(16, 185, 129, 0.15)"/>
      <text x="10" y="14" font-family="'Inter', sans-serif" font-size="9" fill="#10b981" text-anchor="middle">↓</text>
      <text x="28" y="9" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#f1f5f9">Stripe Payout</text>
      <text x="28" y="18" font-family="'Inter', sans-serif" font-size="7" fill="#64748b">SaaS Subscription</text>
      <text x="175" y="14" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#10b981" text-anchor="end">+$650</text>
    </g>

    <!-- Item 5 -->
    <g transform="translate(380, 265)">
      <circle cx="10" cy="10" r="10" fill="rgba(239, 68, 68, 0.15)"/>
      <text x="10" y="14" font-family="'Inter', sans-serif" font-size="9" fill="#ef4444" text-anchor="middle">↑</text>
      <text x="28" y="9" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#f1f5f9">DigitalOcean VPS</text>
      <text x="28" y="18" font-family="'Inter', sans-serif" font-size="7" fill="#64748b">Server Hosting</text>
      <text x="175" y="14" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#ef4444" text-anchor="end">-$24.00</text>
    </g>

    <!-- Bottom Tech Stack Tag Ribbon -->
    <rect x="0" y="252" width="350" height="73" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="14" y="272" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="1">FULL STACK ARCHITECTURE</text>
    <text x="14" y="292" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Frontend: React, Tailwind CSS, Vite | State: Context API</text>
    <text x="14" y="308" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Backend: Node.js, Express REST API | DB: MySQL / SQL</text>
  </g>
</svg>
