<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="laptop-lid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="screen-inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="laptop-base" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="50%" stop-color="#555555"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>
    <radialGradient id="mug-gradient" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#333333"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </radialGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="280" cy="285" rx="190" ry="20" fill="rgba(0,0,0,0.7)" filter="blur(8px)"/>
  <ellipse cx="120" cy="275" rx="45" ry="12" fill="rgba(0,0,0,0.6)" filter="blur(6px)"/>

  <!-- Designer Mug on the left -->
  <g transform="translate(85, 180)">
    <!-- Mug Handle -->
    <path d="M 12 25 C -12 25, -12 65, 12 65" fill="none" stroke="#222222" stroke-width="8" stroke-linecap="round"/>
    <!-- Mug Body -->
    <path d="M 10 10 L 15 80 Q 42 90 70 80 L 75 10 Z" fill="url(#mug-gradient)"/>
    <!-- Mug Rim -->
    <ellipse cx="42" cy="10" rx="32" ry="7" fill="#222222" stroke="#444444" stroke-width="1"/>
    <ellipse cx="42" cy="10" rx="27" ry="5" fill="#111111"/>
    <!-- Mug Text -->
    <text x="42" y="52" font-family="'Inter', sans-serif" font-size="6.5" font-weight="bold" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="1">Full Stack Dev</text>
  </g>

  <!-- Laptop Display Lid (3D angle) -->
  <g transform="translate(130, 20)">
    <!-- Outer Lid Bezel -->
    <path d="M 20 20 L 330 20 L 320 210 L 30 210 Z" fill="url(#laptop-lid)" stroke="#444444" stroke-width="1.5"/>
    
    <!-- Screen Glass -->
    <path d="M 28 28 L 322 28 L 313 202 L 37 202 Z" fill="url(#screen-inner)"/>
    
    <!-- Screen Display Content: Red PORTFOLIO header & Hero mockup -->
    <g transform="translate(37, 28)">
      <!-- Mini Portfolio title inside screen -->
      <text x="140" y="60" font-family="'Bebas Neue', Impact, sans-serif" font-size="44" fill="rgba(220, 20, 30, 0.7)" text-anchor="middle" letter-spacing="2">PORTFOLIO</text>
      
      <!-- Mini Left Text -->
      <text x="15" y="80" font-family="serif" font-style="italic" font-size="8" fill="#ff4d4d">Hello, I'm</text>
      <text x="15" y="94" font-family="'Bebas Neue', Impact, sans-serif" font-size="14" fill="#ffffff">RAHUL</text>
      <text x="15" y="106" font-family="'Bebas Neue', Impact, sans-serif" font-size="9" fill="#ffffff">FULL STACK DEVELOPER</text>
      <rect x="15" y="114" width="65" height="15" rx="2" fill="rgba(255,255,255,0.06)"/>
      
      <!-- Mini Silhouette of Model in center -->
      <path d="M 120 160 C 120 110, 130 90, 140 90 C 150 90, 160 110, 160 160 Z" fill="#181818"/>
      <circle cx="140" cy="80" r="14" fill="#2a2a2a"/>
      <!-- Glasses -->
      <rect x="131" y="77" width="18" height="5" rx="2" fill="#000000"/>
      
      <!-- Mini Right List -->
      <circle cx="210" cy="85" r="4" fill="none" stroke="rgba(255,255,255,0.3)"/>
      <text x="210" y="87" font-size="6" fill="#ff3333" text-anchor="middle">RS</text>
      <text x="218" y="87" font-size="5" fill="#a0a0a0">Full Stack...</text>
      <text x="210" y="98" font-size="5" fill="#ff4444">+ Web Architecture</text>
      <text x="210" y="106" font-size="5" fill="#ff4444">+ Backend &amp; APIs</text>
      <text x="210" y="114" font-size="5" fill="#ff4444">+ Responsive UI</text>
    </g>

    <!-- Laptop Base / Keyboard Deck -->
    <path d="M 5 210 L 345 210 L 360 226 L -10 226 Z" fill="url(#laptop-base)"/>
    <!-- Trackpad notch -->
    <rect x="145" y="210" width="60" height="4" rx="2" fill="#222222"/>
    <!-- Front edge chamfer -->
    <path d="M -10 226 L 360 226 L 358 230 L -8 230 Z" fill="#1a1a1a"/>
  </g>
</svg>
